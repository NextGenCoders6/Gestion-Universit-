# ERP UCCB — pile Docker : MySQL, Django (gunicorn) et nginx.
#
#   cp .env.example .env     puis renseigner les secrets (erp/.env, jamais commité)
#   docker compose up -d --build
#   → http://localhost:8080
name: uccb-erp

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-uccb_erp}
      MYSQL_USER: ${DB_USER:-uccb}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans erp/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Renseignez MYSQL_ROOT_PASSWORD dans erp/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: uccb-erp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-uccb_erp}
      DB_USER: ${DB_USER:-uccb}
      DB_PASSWORD: ${DB_PASSWORD}
      # Un seul relais (nginx) devant Django : l'adresse du client vient de X-Forwarded-For.
      NUM_PROXIES: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro

volumes:
  mysql:
  media:
  static:
