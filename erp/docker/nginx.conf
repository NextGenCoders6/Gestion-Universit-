# Frontal de l'ERP : fichiers statiques et téléversés servis directement, le reste relayé à Django.
upstream erp_django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Documents pédagogiques et photos téléversés.
    client_max_body_size 25m;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        access_log off;
    }

    # Interface React construite (fichiers versionnés par Vite) : servie par Django, mise en cache longue.
    location /assets/ {
        proxy_pass http://erp_django;
        proxy_set_header Host $http_host;
        expires 1y;
    }

    location / {
        proxy_pass http://erp_django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
